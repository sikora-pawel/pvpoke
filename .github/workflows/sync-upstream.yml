name: Sync Upstream & Generate Rankings

on:
  schedule:
    # Co godzinę w aktywnym oknie 09:00-19:00 UTC (10:00-20:00 PL zimą)
    - cron: '0 9-19 * * *'
    # Raz w nocy (złapać późne commity)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_generate:
        description: 'Force regenerate rankings even without upstream changes'
        required: false
        default: 'false'
        type: boolean
      merge_to_master:
        description: 'Merge develop to master after successful generation (enables production deploy)'
        required: false
        default: 'true'
        type: boolean
      send_digest:
        description: 'Force send daily digest email now'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
      should_deploy: ${{ steps.merge.outputs.merged }}

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/pvpoke/pvpoke.git || true
          git fetch upstream master
          git fetch origin master

      - name: Check for upstream changes
        id: sync
        run: |
          # Get current HEAD of upstream
          UPSTREAM_HEAD=$(git rev-parse upstream/master)

          # Check if we have a marker file with last synced commit
          LAST_SYNC_FILE=".last-upstream-sync"

          if [ -f "$LAST_SYNC_FILE" ]; then
            LAST_SYNC=$(cat "$LAST_SYNC_FILE")
          else
            LAST_SYNC=""
          fi

          echo "Upstream HEAD: $UPSTREAM_HEAD"
          echo "Last sync: $LAST_SYNC"

          if [ "$UPSTREAM_HEAD" != "$LAST_SYNC" ] || [ "${{ github.event.inputs.force_generate }}" == "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected or force generate requested"

            # Capture upstream commits for email
            if [ -n "$LAST_SYNC" ]; then
              echo ""
              echo "=== New commits from upstream ==="
              UPSTREAM_COMMITS=$(git log --oneline $LAST_SYNC..$UPSTREAM_HEAD 2>/dev/null || echo "Unable to fetch commit list")
              echo "$UPSTREAM_COMMITS"
            else
              UPSTREAM_COMMITS="First sync - no previous baseline"
            fi

            # Save to output (multiline)
            {
              echo "upstream_commits<<EOF"
              echo "$UPSTREAM_COMMITS"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes from upstream"
            echo "upstream_commits=" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes to develop
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          echo "Merging upstream changes into develop..."

          # Merge upstream, preferring upstream for conflicts (upstream is authoritative for data)
          git merge upstream/master -m "Merge upstream pvpoke changes" \
            --strategy-option=theirs \
            --allow-unrelated-histories || true

          # Save the synced commit hash
          git rev-parse upstream/master > .last-upstream-sync
          git add .last-upstream-sync
          git commit -m "Update last upstream sync marker" || true

      - name: Patch gamemaster data
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          python3 scripts/patch-gamemaster.py
          if git diff --quiet; then
            echo "No patches needed"
          else
            git add -A
            git commit -m "Auto-patch gamemaster data (post-upstream)"
          fi

      - name: Setup Node.js
        if: steps.sync.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        if: steps.sync.outputs.has_changes == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite
          ini-values: memory_limit=2G

      - name: Generate Rankings
        id: generate
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          cd scripts/cli
          echo "Generating rankings..."

          # Run and capture output
          node generate-rankings.js 2>&1 | tee /tmp/rankings-output.txt

          # Extract cups list for email
          CUPS_LIST=$(grep -A 100 "Cups to generate:" /tmp/rankings-output.txt | grep "^  - " | head -20 || echo "")
          SUMMARY=$(grep -A 5 "^SUMMARY" /tmp/rankings-output.txt || echo "")

          # Save to output (multiline)
          {
            echo "cups_list<<EOF"
            echo "$CUPS_LIST"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit generated rankings to develop
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "Auto-generate rankings from upstream sync

          Upstream: $(git rev-parse upstream/master)
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Co-Authored-By: GitHub Actions <actions@github.com>" || echo "No changes to commit"

      - name: Push to develop
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git push origin develop

      - name: Merge develop to master (if enabled)
        id: merge
        if: steps.sync.outputs.has_changes == 'true' && (github.event_name == 'schedule' || github.event.inputs.merge_to_master == 'true')
        run: |
          echo "Merging develop to master..."
          git checkout -B master origin/master
          git merge develop -m "Merge develop: auto-generated rankings

          Co-Authored-By: GitHub Actions <actions@github.com>"
          git push origin master
          echo "merged=true" >> $GITHUB_OUTPUT

      # Log sync result for daily digest
      - name: Log sync result
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          # Switch to master to update digest log
          git checkout -B master origin/master

          DIGEST_FILE=".github/sync-digest.log"
          mkdir -p .github

          # Append today's sync info
          {
            echo "---"
            echo "Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Commits:"
            echo "${{ steps.sync.outputs.upstream_commits }}" | sed 's/^/  /'
            echo "Cups: ${{ steps.generate.outputs.cups_list }}"
            echo ""
          } >> "$DIGEST_FILE"

          git add "$DIGEST_FILE"
          git commit -m "Update sync digest log" || true
          git push origin master || true

      # Determine if this is digest hour (19:00 UTC = last scheduled run of the day)
      - name: Check if digest hour and read daily log
        id: digest_check
        run: |
          CURRENT_HOUR=$(date -u +"%H")
          if [ "$CURRENT_HOUR" == "19" ] || [ "${{ github.event.inputs.send_digest }}" == "true" ]; then
            echo "is_digest_hour=true" >> $GITHUB_OUTPUT
          else
            echo "is_digest_hour=false" >> $GITHUB_OUTPUT
          fi

          # Read digest log to check for changes in last 24h
          git checkout -B master origin/master

          DIGEST_FILE=".github/sync-digest.log"

          if [ -f "$DIGEST_FILE" ]; then
            # Check if log has actual sync entries (not just header)
            SYNC_COUNT=$(grep -c "^---$" "$DIGEST_FILE" 2>/dev/null || echo "0")

            if [ "$SYNC_COUNT" -gt "0" ]; then
              echo "had_changes_today=true" >> $GITHUB_OUTPUT
              echo "sync_count=$SYNC_COUNT" >> $GITHUB_OUTPUT

              # Read full log content for email
              {
                echo "digest_content<<EOF"
                cat "$DIGEST_FILE"
                echo "EOF"
              } >> $GITHUB_OUTPUT
            else
              echo "had_changes_today=false" >> $GITHUB_OUTPUT
              echo "sync_count=0" >> $GITHUB_OUTPUT
              echo "digest_content=" >> $GITHUB_OUTPUT
            fi
          else
            echo "had_changes_today=false" >> $GITHUB_OUTPUT
            echo "sync_count=0" >> $GITHUB_OUTPUT
            echo "digest_content=" >> $GITHUB_OUTPUT
          fi

      # Send daily digest email (only at 19:00 UTC or manual trigger)
      - name: Send daily digest email
        if: steps.digest_check.outputs.is_digest_hour == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📊 PvPoke Daily Digest - ${{ steps.digest_check.outputs.had_changes_today == 'true' && format('{0} sync(s) today!', steps.digest_check.outputs.sync_count) || 'No changes today' }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: PvPoke Bot <${{ secrets.EMAIL_USERNAME }}>
          body: |
            PvPoke Daily Sync Digest
            ========================

            Status: ${{ steps.digest_check.outputs.had_changes_today == 'true' && format('✅ {0} sync(s) in the last 24 hours', steps.digest_check.outputs.sync_count) || '📋 No upstream changes in the last 24 hours' }}

            ${{ steps.digest_check.outputs.had_changes_today == 'true' && '=== Syncs Today ===' || '' }}
            ${{ steps.digest_check.outputs.digest_content }}

            ---
            Sync schedule: Every hour 09:00-19:00 UTC + 03:00 UTC
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

      # Clear digest log after sending
      - name: Clear digest log after sending
        if: steps.digest_check.outputs.is_digest_hour == 'true'
        run: |
          git checkout -B master origin/master

          DIGEST_FILE=".github/sync-digest.log"
          if [ -f "$DIGEST_FILE" ]; then
            echo "# Sync Digest Log - cleared $(date -u +"%Y-%m-%d")" > "$DIGEST_FILE"
            git add "$DIGEST_FILE"
            git commit -m "Clear digest log after daily email" || true
            git push origin master || true
          fi

  # Deploy to GitHub Pages (only when merged to master)
  deploy:
    needs: sync-and-generate
    if: needs.sync-and-generate.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src/data'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
